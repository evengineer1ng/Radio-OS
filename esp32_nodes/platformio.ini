[platformio]
default_envs = c6_node

; ─── ESP32-C6 (Waveshare DEV-KIT-N8) ───────────────────────────────────────
[env:c6_node]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.wchusbserial58CD0058151
monitor_port = /dev/cu.wchusbserial58CD0058151
build_flags =
    -DBOARD_C6
    -DNODE_ID=1          ; change to 2 for second C6

; ─── Classic ESP32 DevKit C ─────────────────────────────────────────────────
[env:esp32_node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = /dev/cu.wchusbserial????   ; fill in when connected
build_flags =
    -DBOARD_ESP32
    -DNODE_ID=3          ; change to 4 for second classic ESP32

; ─── Shared settings ────────────────────────────────────────────────────────
[env]
lib_deps =
    links2004/WebSockets@^2.4.1
